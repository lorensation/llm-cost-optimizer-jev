[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "llm-cost-autopilot"
version = "0.1.0"
description = "Evidence-based, budget-aware LLM routing with verification"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "jsonschema==4.25.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "PyYAML==6.0.3",
  "SQLAlchemy==2.0.43",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-asyncio==1.1.0", "respx==0.22.0"]
dashboard = ["streamlit==1.48.1", "pandas==2.3.1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
