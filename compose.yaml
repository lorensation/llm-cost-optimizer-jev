services:
  api:
    build: .
    command: ["uvicorn","app.api:app","--host","0.0.0.0","--port","8000"]
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["autopilot-data:/app/data"]
  worker:
    build: .
    command: ["python","-m","app.worker"]
    volumes: ["autopilot-data:/app/data"]
  dashboard:
    build: .
    command: ["sh","-c","pip install --no-cache-dir streamlit==1.48.1 pandas==2.3.1 && streamlit run dashboard/app.py --server.address=0.0.0.0"]
    ports: ["127.0.0.1:8501:8501"]
    volumes: ["autopilot-data:/app/data:ro"]
    profiles: ["dashboard"]
volumes:
  autopilot-data:
